<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DXF Reader</title>
</head>
<body>
<div style="margin: 20px;">
    <input type="file" id="file-input">
    <input type="file" id="file-input-sli">
    <button onclick="loadAndParseXLSX()">Load and parse XLS</button>
</div>
<div id="threeContainer" style="display: flex; flex-wrap: wrap; gap: 20px;"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.min.js"></script>

<script type="module">
    import init, {convert_sli_xsl_to_json} from "./pkg/dxf_reader.js";

    async function loadAndParseXLSX() {
        await init();

        const file = document.getElementById("file-input").files[0];
        const file_sli = document.getElementById("file-input-sli").files[0];

        if (!file || !file_sli) return alert("Пожалуйста, выберите оба файла!");

        const text = await file_sli.text();
        const reader = new FileReader();

        reader.onload = async () => {
            const bytes = new Uint8Array(reader.result);
            const jsonResult = convert_sli_xsl_to_json(text, bytes);
            const data = JSON.parse(jsonResult);

            const dataZ = new Set();
            for (const item of data) {
                for (const vertex of item.vertices) {
                    dataZ.add(vertex.z);
                }
            }

            const container = document.getElementById("threeContainer");
            container.innerHTML = "";

            for (const z of dataZ) {
                const sliceData = data.filter(item =>
                    item.vertices.every(i => i.z === z)
                );
                if (sliceData.length <= 30) continue;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0xffffff);

                const width = 1200;  // Увеличили ширину
                const height = 1200; // Увеличили высоту
                const camera = new THREE.OrthographicCamera(
                    width / -2, width / 2,
                    height / 2, height / -2,
                    0.1, 2000
                );
                camera.position.set(0, 0, 1000);
                camera.lookAt(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({antialias: true});
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);

                const header = document.createElement("h2");
                header.innerText = `Z = ${z}`;
                container.appendChild(header);
                container.appendChild(renderer.domElement);

                const scale = 15;
                const offsetX = 0, offsetY = 0;

                function transformPoint(p) {
                    return {
                        x: p.y * scale + offsetX,
                        y: -p.x * scale + offsetY
                    };
                }

                let minX = Infinity, maxX = -Infinity;
                let minY = Infinity, maxY = -Infinity;

                for (const item of sliceData) {
                    const points = item.vertices.map(transformPoint);
                    points.forEach(p => {
                        minX = Math.min(minX, p.x);
                        maxX = Math.max(maxX, p.x);
                        minY = Math.min(minY, p.y);
                        maxY = Math.max(maxY, p.y);
                    });
                }

                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;
                const viewScale = Math.min(
                    width / (maxX - minX || 1),
                    height / (maxY - minY || 1)
                ) * 0.95;

                for (const item of sliceData) {
                    const points = item.vertices.map(p => {
                        const transformed = transformPoint(p);
                        return {
                            x: (transformed.x - centerX) * viewScale,
                            y: (transformed.y - centerY) * viewScale
                        };
                    });

                    // Только линии — без заливки
                    if (points.length === 3 || points.length === 4) {
                        const vertices = [];
                        const numbers = [];
                        const numberPositions = [];

                        if(points.length === 4){
                            vertices.push(points[0].x, points[0].y, 0);
                            vertices.push(points[1].x, points[1].y, 0);
                            vertices.push(points[2].x, points[2].y, 0);
                            vertices.push(points[3].x, points[3].y, 0);
                        }
                        if(points.length === 3){
                            vertices.push(points[0].x, points[0].y, 0);
                            vertices.push(points[1].x, points[1].y, 0);
                            vertices.push(points[2].x, points[2].y, 0);

                        }
                        // Замыкаем контур
                        vertices.push(points[0].x, points[0].y, 0);

                        const geometry = new THREE.BufferGeometry();
                        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

                        const material = new THREE.LineBasicMaterial({
                            color: 0xff0000, // чёрный контур
                            linewidth: 1
                        });

                        const line = new THREE.Line(geometry, material);
                        scene.add(line);
                    }
                }
                renderer.render(scene, camera);

            }
        };
        reader.readAsArrayBuffer(file);
    }

    window.loadAndParseXLSX = loadAndParseXLSX;
</script>
</body>
</html>
