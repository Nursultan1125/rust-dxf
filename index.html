<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Frontend Project</title>
</head>
<body>
<h1>Hello, Frontend!</h1>
<!--<input type="file" id="fileInput"/>-->
<!--<div id="cad-view"></div>-->
<!--<pre id="output"></pre>-->
<!--<script src="index.js" type="module"></script>-->

<input type="file" id="file-input">
<input type="file" id="file-input-sli">
<button onclick="loadAndParseXLSX()">Load and parse XLS</button>
<div id="threeContainer"></div>
<!-- Последняя версия Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>

<!-- Или с дополнительными модулями (например, OrbitControls) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.min.js"></script>


<script type="module">
    import init, {convert_sli_full_xsl_to_json} from "./pkg/dxf_reader.js";

    let font = null; // Global font variable

    // Load font once at the beginning
    const fontLoader = new THREE.FontLoader();
    fontLoader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function(loadedFont) {
        font = loadedFont;
    });

    function addColorBar(minValue, maxValue, scene, width, height) {
        function getColorByValue(value) {
            // Normalize value between 0 and 1
            const t = (value - minValue) / (maxValue - minValue);
            // Vivid blue-green-yellow-red gradient
            let r = 1, g = 1 - t, b = 0;
            return new THREE.Color(r, g, b);
        }
        const barWidth = width * 0.8;
        const barHeight = 30;
        const barX = -barWidth / 2;
        const barY = height / 2 - 100; // Move color bar higher above the grid

        // Create gradient segments
        const segments = 100;
        const segmentWidth = barWidth / segments;

        for (let i = 0; i < segments; i++) {
            const t = i / (segments - 1);
            const value = minValue + t * (maxValue - minValue);
            const color = getColorByValue(value);

            const geometry = new THREE.PlaneGeometry(segmentWidth, barHeight);
            const material = new THREE.MeshBasicMaterial({ color: color });
            const segment = new THREE.Mesh(geometry, material);

            segment.position.set(
                barX + i * segmentWidth + segmentWidth / 2,
                barY,
                0
            );
            scene.add(segment);
        }

        // Add min/max labels
        if (font) {
            const textMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });

            // Min value
            const minGeometry = new THREE.TextGeometry(minValue.toFixed(2), {
                font: font,
                size: 10,
                height: 0.1
            });
            const minText = new THREE.Mesh(minGeometry, textMaterial);
            minText.position.set(barX - 50, barY + 10, 0); // Move label higher
            scene.add(minText);

            // Max value
            const maxGeometry = new THREE.TextGeometry(maxValue.toFixed(2), {
                font: font,
                size: 10,
                height: 0.1
            });
            const maxText = new THREE.Mesh(maxGeometry, textMaterial);
            maxText.position.set(barX + barWidth + 10, barY + 10, 0); // Move label higher
            scene.add(maxText);
        }
    }

    // Wait for font to load
    async function waitForFont() {
        if (!font) {
            await new Promise(resolve => {
                const checkFont = setInterval(() => {
                    if (font) {
                        clearInterval(checkFont);
                        resolve();
                    }
                }, 100);
            });
        }
    }

    // Load and parse files
    async function loadAndParseFiles() {
        let file = document.getElementById("file-input").files[0];
        let file_sli = document.getElementById("file-input-sli").files[0];

        if (!file) return { success: false, error: "Выберите файл!" };

        const text = await file_sli.text();

        return new Promise((resolve) => {
            let reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = async () => {
                let bytes = new Uint8Array(reader.result);
                let jsonResult = convert_sli_full_xsl_to_json(text, bytes);
                const data = JSON.parse(jsonResult);
                console.log("Результат:", data);
                resolve({ success: true, data });
            };
        });
    }

    // Extract unique Z coordinates from data
    function extractZCoordinates(data) {
        const dataZ = new Set();
        for (const item of data) {
            for (const vertex of item.vertices) {
                dataZ.add(vertex.z);
            }
        }
        return dataZ;
    }

    // Create and setup scene, camera, renderer, and controls
    function setupScene(width, height) {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const GLOBAL_SCALE = 0.9;
        const camera = new THREE.OrthographicCamera(
            width / -2,
            width / 2,
            height / 2,
            height / -2,
            0.1,
            2000
        );
        camera.position.set(0, 0, 1000);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(1600, 1600);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Add OrbitControls for zoom and pan
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableRotate = false; // Disable rotation, only zoom and pan
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.minDistance = 0;  // Минимальная дистанция zoom
        controls.maxDistance = Infinity;  // Максимальная дистанция
        controls.addEventListener('change', function() {
            camera.updateProjectionMatrix();
            renderer.render(scene, camera);
        });

        return { scene, camera, renderer, controls, GLOBAL_SCALE };
    }

    // Create color mapping function
    function createColorMapper(minValue, maxValue) {
        return function(value) {
            // Normalize value between 0 and 1
            const t = (value - minValue) / (maxValue - minValue);
            // Vivid blue-green-yellow-red gradient
            let r = 1, g = 1 - t, b = 0;
            return new THREE.Color(r, g, b);
        };
    }

    // Transform point coordinates
    function createPointTransformer(scale, offsetX, offsetY) {
        return function(p) {
            return {
                x: p.x * scale + offsetX,
                y: -p.y * scale + offsetY
            };
        };
    }

    // Calculate boundaries of all points
    function calculateBoundaries(sliceData, transformPoint) {
        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;

        for (const item of sliceData) {
            const points = item.vertices.map(transformPoint);
            points.forEach(p => {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
            });
        }

        return { minX, maxX, minY, maxY };
    }

    // Calculate center and scale for visualization
    function calculateViewParameters(boundaries, width, height, GLOBAL_SCALE) {
        const { minX, maxX, minY, maxY } = boundaries;
        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        const viewScale = Math.min(
            width / (maxX - minX || 1),  // Защита от деления на 0
            height / (maxY - minY || 1)
        ) * GLOBAL_SCALE;

        return { centerX, centerY, viewScale };
    }

    // Transform points using view parameters
    function transformPointsForView(points, transformPoint, centerX, centerY, viewScale) {
        return points.map(p => {
            const transformed = transformPoint(p);
            return {
                x: (transformed.x - centerX) * viewScale,
                y: (transformed.y - centerY) * viewScale
            };
        });
    }

    // Render polygon (triangle or quadrilateral)
    function renderPolygon(points, item, scene, getColorByValue) {
        // Create geometry
        const geometry = new THREE.BufferGeometry();
        const vertices = [];

        // Add all points
        for (const point of points) {
            vertices.push(point.x, point.y, 0);
        }

        // Add first point again to close the shape
        vertices.push(points[0].x, points[0].y, 0);

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

        // Fill color based on item.row.as2
        const fillColor = getColorByValue(item.row.as2[0] || 0);

        const fillMaterial = new THREE.MeshBasicMaterial({
            color: fillColor,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.7,
            depthWrite: false // Ensure outline is visible
        });

        // Create shape for filling
        const shape = new THREE.Shape();
        shape.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            shape.lineTo(points[i].x, points[i].y);
        }
        shape.lineTo(points[0].x, points[0].y);
        const shapeGeometry = new THREE.ShapeGeometry(shape);
        const mesh = new THREE.Mesh(shapeGeometry, fillMaterial);
        scene.add(mesh);

        // Add outline
        const material = new THREE.LineBasicMaterial({
            color: 0xFF0000,
            linewidth: 1,
            depthTest: false // Always on top
        });
        const line = new THREE.LineLoop(geometry, material);
        scene.add(line);

        // Calculate centroid for text positioning
        const centroid = points.reduce((acc, p) => ({
            x: acc.x + p.x,
            y: acc.y + p.y
        }), {x: 0, y: 0});

        centroid.x /= points.length;
        centroid.y /= points.length;

        return centroid;
    }

    // Add text label to the scene
    function addTextLabel(text, centroid, scene) {
        const textGeometry = new THREE.TextGeometry(text, {
            font: font,
            size: 5,
            height: 0.1
        });
        textGeometry.computeBoundingBox();
        const textWidth = textGeometry.boundingBox.max.x - textGeometry.boundingBox.min.x;
        const textHeight = textGeometry.boundingBox.max.y - textGeometry.boundingBox.min.y;

        const textMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const textMesh = new THREE.Mesh(textGeometry, textMaterial);

        // Position text in the center of the figure
        textMesh.position.set(
            centroid.x - textWidth/2,
            centroid.y - textHeight/2,
            0.1
        );

        scene.add(textMesh);
    }

    // Render line
    function renderLine(points, scene) {
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        for (const point of points) {
            vertices.push(point.x, point.y, 0);
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const material = new THREE.LineBasicMaterial({
            color: 0x000000,
            linewidth: 1,
            depthTest: false
        });
        const line = new THREE.Line(geometry, material);
        scene.add(line);
    }

    // Process and visualize data for a specific Z coordinate
    function visualizeSlice(z, data, container) {
        const sliceData = data.filter(item => item.vertices.every(i => i.z === z));
        if (sliceData.length <= 30 || sliceData.every((e) => e.entity_type === "LINE")) return;

        // Calculate min and max values for color mapping
        let minValue = Math.min(...sliceData.map((e) => e.row.as2[0])) || 0;
        let maxValue = Math.max(...sliceData.map((e) => e.row.as2[0])) || 5;
        const getColorByValue = createColorMapper(minValue, maxValue);

        // Setup scene
        const width = 1200;
        const height = 1200;
        const { scene, camera, renderer, controls, GLOBAL_SCALE } = setupScene(width, height);

        // Add header and renderer to container
        const header = document.createElement("h2");
        header.innerText = `Z = ${z}`;
        container.appendChild(header);
        container.appendChild(renderer.domElement);

        // Setup point transformation
        const scale = 15;
        const transformPoint = createPointTransformer(scale, 0, 0);

        // Calculate boundaries and view parameters
        const boundaries = calculateBoundaries(sliceData, transformPoint);
        const { centerX, centerY, viewScale } = calculateViewParameters(boundaries, width, height, GLOBAL_SCALE);

        // Process each item in the slice
        for (const item of sliceData) {
            const points = transformPointsForView(item.vertices, transformPoint, centerX, centerY, viewScale);

            if (points.length === 3 || points.length === 4) {
                // Render polygon and add text label
                const centroid = renderPolygon(points, item, scene, getColorByValue);
                addTextLabel(item.row.as2.toString(), centroid, scene);
            }
            else if (points.length === 2) {
                // Render line
                renderLine(points, scene);
            }
        }

        // Render the scene
        renderer.render(scene, camera);
    }

    // Main function to load and parse XLSX
    async function loadAndParseXLSX() {
        await init(); // Инициализация wasm
        await waitForFont();

        const result = await loadAndParseFiles();
        if (!result.success) return alert(result.error);

        const data = result.data;
        const dataZ = extractZCoordinates(data);

        const container = document.getElementById("threeContainer");
        container.innerHTML = "";

        // Visualize each Z coordinate
        for (const z of dataZ) {
            visualizeSlice(z, data, container);
            if(z > 30) break;
        }
    }

    // Делаем функцию доступной глобально
    window.loadAndParseXLSX = loadAndParseXLSX;
</script>

</body>
</html>
